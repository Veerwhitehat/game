<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anita Attendance & Salary Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .hidden { display: none !important; }

        /* Dark Mode styles */
        body.dark { background-color: #1a1a1a; color: #f5f5f5; }
        .dark #app { background-color: #242424; }
        .dark .bg-white { background-color: #2d2d2d !important; }
        .dark .text-gray-900 { color: #f5f5f5 !important; }
        .dark .text-gray-600 { color: #ccc !important; }
        .dark .bg-gray-50 { background-color: #1a1a1a !important; }
        .dark .bg-gray-100 { background-color: #333 !important; }
        .dark .border-gray-100 { border-color: #444 !important; }
        .dark .border-gray-200 { border-color: #444 !important; }
        .dark .divide-gray-100 > * + * { border-color: #444 !important; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
    <div id="app" class="max-w-md mx-auto bg-white min-h-screen shadow-lg relative pb-20">
        <!-- Content will be injected here -->
    </div>

    <!-- Face ID Modal -->
    <div id="faceid-modal" class="fixed inset-0 bg-black bg-opacity-80 z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-[3rem] p-8 w-[90%] max-w-sm text-center space-y-6">
            <h2 class="text-2xl font-bold">Checking Face...</h2>
            <div class="relative w-64 h-64 mx-auto overflow-hidden rounded-[2rem] bg-black">
                <video id="auth-video" autoplay playsinline class="w-full h-full object-cover opacity-60"></video>
                <div id="faceid-scanner-line" class="absolute top-0 left-0 w-full h-1 bg-blue-500 shadow-[0_0_15px_rgba(59,130,246,1)] animate-[scan_2s_ease-in-out_infinite]"></div>
                <div class="absolute inset-0 border-4 border-blue-500/30 rounded-[2rem] pointer-events-none"></div>
            </div>
            <style>
                @keyframes scan {
                    0%, 100% { top: 0; }
                    50% { top: 100%; }
                }
            </style>
            <p id="faceid-msg" class="text-gray-600 font-medium">Anita, please look at the camera</p>
            <div id="faceid-actions" class="flex flex-col space-y-3">
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="simulateFaceID(true)" class="bg-green-500 text-white py-4 rounded-2xl font-bold text-sm">MATCH</button>
                    <button onclick="simulateFaceID(false)" class="bg-red-500 text-white py-4 rounded-2xl font-bold text-sm">NO MATCH</button>
                </div>
                <button onclick="closeFaceID()" class="text-gray-400 py-2 text-sm font-bold uppercase tracking-wider">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Admin Login Modal -->
    <div id="admin-login-modal" class="fixed inset-0 bg-black bg-opacity-80 z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-3xl p-8 w-80 text-center space-y-6">
            <h2 class="text-xl font-bold text-red-600">Admin Mode</h2>
            <input type="password" id="admin-password-input" class="w-full border-2 border-gray-200 rounded-xl p-4 text-center text-2xl" placeholder="••••">
            <div class="grid grid-cols-2 gap-3">
                <button onclick="submitAdminLogin()" class="bg-red-600 text-white py-3 rounded-xl font-bold">Login</button>
                <button onclick="closeAdminLogin()" class="bg-gray-200 text-gray-700 py-3 rounded-xl font-bold">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Password Modal -->
    <div id="password-modal" class="fixed inset-0 bg-black bg-opacity-80 z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-3xl p-8 w-80 text-center space-y-6">
            <h2 class="text-xl font-bold">Enter Password</h2>
            <input type="password" id="maid-password-input" class="w-full border-2 border-gray-200 rounded-xl p-4 text-center text-2xl" placeholder="••••">
            <div class="grid grid-cols-2 gap-3">
                <button onclick="submitMaidPassword()" class="bg-blue-600 text-white py-3 rounded-xl font-bold">Submit</button>
                <button onclick="closePasswordModal()" class="bg-gray-200 text-gray-700 py-3 rounded-xl font-bold">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // State Management
        const DEFAULT_SETTINGS = {
            monthlySalary: 19000,
            shiftTimes: ["08:00", "13:00", "18:00"],
            adminPassword: "4248",
            maidPassword: "anita",
            currency: "₹",
            darkMode: false
        };

        let state = {
            settings: { ...DEFAULT_SETTINGS },
            attendance: {}, // format: { "YYYY-MM-DD": { shift0: { status: 'success', time: '...', auth: '...' } } }
            credits: 0,
            payouts: [],
            lastPayoutDate: null,
            faceEnrolled: false
        };

        function saveState() {
            localStorage.setItem('anita_app_state', JSON.stringify(state));
        }

        function loadState() {
            const saved = localStorage.getItem('anita_app_state');
            if (saved) {
                try {
                    state = JSON.parse(saved);
                    // Merge with default settings to ensure new keys exist
                    state.settings = { ...DEFAULT_SETTINGS, ...state.settings };
                } catch (e) {
                    console.error("Failed to load state", e);
                }
            }
            applyDarkMode();
        }

        function applyDarkMode() {
            if (state.settings.darkMode) {
                document.body.classList.add('dark');
            } else {
                document.body.classList.remove('dark');
            }
        }

        // Initial load
        loadState();

        // Constants for logic
        const SHIFT_WINDOW_MINS = 30;

        function getCurrentDateStr() {
            return new Date().toISOString().split('T')[0];
        }

        function getTimeInMinutes(timeStr) {
            const [h, m] = timeStr.split(':').map(Number);
            return h * 60 + m;
        }

        function getNowInMinutes() {
            const now = new Date();
            return now.getHours() * 60 + now.getMinutes();
        }

        function getDaysInMonth(year, month) {
            return new Date(year, month + 1, 0).getDate();
        }

        function calculateSalary() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const daysInMonth = getDaysInMonth(year, month);
            const totalShiftsInMonth = daysInMonth * state.settings.shiftTimes.length;
            const shiftValue = state.settings.monthlySalary / totalShiftsInMonth;
            const lastPayout = state.lastPayoutDate ? new Date(state.lastPayoutDate) : new Date(year, month, 1);

            let earnings = 0;
            let latePenalties = 0;
            let missedShifts = 0;
            let totalMissedValue = 0;

            // Iterate through all days of the month up to now
            for (let d = 1; d <= daysInMonth; d++) {
                const date = new Date(year, month, d);
                const dateStr = date.toISOString().split('T')[0];
                const dayAttendance = state.attendance[dateStr] || {};

                // If this day is entirely before the last payout, skip it
                if (date < new Date(lastPayout.getFullYear(), lastPayout.getMonth(), lastPayout.getDate())) continue;
                // If the day is in the future, don't count misses yet
                if (date > now && d > now.getDate()) continue;

                for (let i = 0; i < state.settings.shiftTimes.length; i++) {
                    const shiftStartStr = state.settings.shiftTimes[i];
                    const shiftStartMins = getTimeInMinutes(shiftStartStr);
                    const shiftTime = new Date(year, month, d);
                    shiftTime.setHours(Math.floor(shiftStartMins / 60), shiftStartMins % 60, 0, 0);

                    const record = dayAttendance[`shift${i}`];

                    if (record) {
                        if (record.timestamp > lastPayout.getTime()) {
                            earnings += shiftValue;
                            if (record.status === 'late' && !record.penaltyCanceled) {
                                latePenalties += 50;
                            }
                        }
                    } else {
                        const windowEnd = new Date(shiftTime.getTime() + SHIFT_WINDOW_MINS * 60000);
                        if (now > windowEnd && windowEnd > lastPayout) {
                            missedShifts++;
                            totalMissedValue += shiftValue;
                        }
                    }
                }
            }

            const availableCredits = state.credits;
            const potentialCancellations = Math.floor(latePenalties / 50);
            const actuallyCanceled = Math.min(availableCredits, potentialCancellations);

            const netLatePenalties = latePenalties - (actuallyCanceled * 50);
            const currentSalary = earnings - netLatePenalties;

            return {
                currentSalary: Math.max(0, currentSalary),
                totalEarnings: earnings,
                latePenalties,
                netLatePenalties,
                missedShifts,
                totalMissedValue,
                usedCredits: actuallyCanceled,
                remainingCredits: availableCredits - actuallyCanceled
            };
        }

        let currentAuthCallback = null;

        function showFaceID(callback) {
            currentAuthCallback = callback;
            document.getElementById('faceid-modal').classList.remove('hidden');
            document.getElementById('faceid-msg').textContent = "Anita, please look at the camera";
            startCamera('auth-video');
            lucide.createIcons();
        }

        function simulateFaceID(success) {
            const msg = document.getElementById('faceid-msg');
            if (success) {
                msg.textContent = "Face Recognized!";
                msg.classList.add('text-green-600');
                setTimeout(() => {
                    closeFaceID();
                    if (currentAuthCallback) currentAuthCallback('faceid');
                }, 1000);
            } else {
                msg.textContent = "Face ID failed. Enter password";
                msg.classList.add('text-red-600');
                setTimeout(() => {
                    closeFaceID();
                    showPasswordModal();
                }, 1000);
            }
        }

        function closeFaceID() {
            document.getElementById('faceid-modal').classList.add('hidden');
            document.getElementById('faceid-msg').classList.remove('text-green-600', 'text-red-600');
            stopCamera();
        }

        function showPasswordModal() {
            document.getElementById('password-modal').classList.remove('hidden');
            document.getElementById('maid-password-input').value = '';
            document.getElementById('maid-password-input').focus();
        }

        function closePasswordModal() {
            document.getElementById('password-modal').classList.add('hidden');
        }

        let currentView = 'maid'; // 'maid', 'admin', 'payout', 'enroll'

        function showAdminLogin() {
            document.getElementById('admin-login-modal').classList.remove('hidden');
            document.getElementById('admin-password-input').value = '';
            document.getElementById('admin-password-input').focus();
        }

        function closeAdminLogin() {
            document.getElementById('admin-login-modal').classList.add('hidden');
        }

        function submitAdminLogin() {
            const input = document.getElementById('admin-password-input').value;
            if (input === state.settings.adminPassword) {
                closeAdminLogin();
                setView('admin');
            } else {
                alert("Wrong admin password!");
            }
        }

        function setView(view) {
            currentView = view;
            render();
        }

        function render() {
            const app = document.getElementById('app');
            const salaryData = calculateSalary();

            if (!state.faceEnrolled && currentView !== 'admin') {
                currentView = 'enroll';
            }

            if (currentView === 'enroll') {
                renderEnrollView(app);
            } else if (currentView === 'maid') {
                renderMaidView(app, salaryData);
            } else if (currentView === 'admin') {
                renderAdminView(app, salaryData);
            } else if (currentView === 'payout') {
                renderPayoutView(app, salaryData);
            }
            lucide.createIcons();
        }

        function renderEnrollView(app) {
            app.innerHTML = `
                <div class="flex flex-col items-center justify-center min-h-screen p-8 bg-blue-600 text-white text-center">
                    <div class="mb-8">
                        <i data-lucide="user-plus" class="w-16 h-16 mx-auto mb-4"></i>
                        <h1 class="text-3xl font-bold">Hello Anita!</h1>
                        <p class="opacity-90 text-lg">We need to see your face to setup the app.</p>
                    </div>

                    <div class="relative w-64 h-64 mx-auto mb-10 overflow-hidden rounded-[3rem] border-4 border-white shadow-2xl bg-black">
                        <video id="enroll-video" autoplay playsinline class="w-full h-full object-cover"></video>
                        <div class="absolute inset-0 border-[20px] border-blue-600/30 rounded-[3rem] pointer-events-none"></div>
                    </div>

                    <button onclick="startEnrollment()" id="enroll-btn" class="bg-white text-blue-600 w-full py-6 rounded-3xl text-2xl font-bold shadow-xl active:scale-95 transition-transform">
                        REGISTER MY FACE
                    </button>
                    <p class="mt-6 text-sm opacity-60">This will only take a second</p>
                </div>
            `;
            startCamera('enroll-video');
        }

        async function startCamera(videoId) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                const video = document.getElementById(videoId);
                if (video) video.srcObject = stream;
                window.currentStream = stream;
            } catch (err) {
                console.error("Camera error:", err);
                // Fallback for environments without camera
                const video = document.getElementById(videoId);
                if (video) {
                    video.style.backgroundColor = '#333';
                    const placeholder = document.createElement('div');
                    placeholder.className = 'absolute inset-0 flex items-center justify-center text-gray-500';
                    placeholder.innerHTML = '<i data-lucide="video-off" class="w-12 h-12"></i>';
                    video.parentElement.appendChild(placeholder);
                    lucide.createIcons();
                }
            }
        }

        function stopCamera() {
            if (window.currentStream) {
                window.currentStream.getTracks().forEach(track => track.stop());
                window.currentStream = null;
            }
        }

        function startEnrollment() {
            const btn = document.getElementById('enroll-btn');
            btn.innerHTML = '<span class="animate-pulse">Capturing...</span>';
            btn.disabled = true;

            setTimeout(() => {
                state.faceEnrolled = true;
                saveState();
                stopCamera();
                setView('maid');
            }, 2000);
        }

        function renderMaidView(app, salaryData) {
            const shiftInfo = getCurrentShiftInfo();

            let actionButtonHtml = '';
            if (shiftInfo) {
                let statusColor = 'bg-green-500';
                let statusText = 'On-Time';
                if (shiftInfo.status === 'early') { statusColor = 'bg-blue-500'; statusText = 'Early Arrival'; }
                if (shiftInfo.status === 'late') { statusColor = 'bg-yellow-500'; statusText = 'Late Arrival'; }

                actionButtonHtml = `
                    <div class="p-6">
                        <button onclick="showFaceID(logAttendance)" class="${statusColor} w-full text-white rounded-3xl p-8 shadow-xl flex flex-col items-center justify-center space-y-4 transform active:scale-95 transition-transform">
                            <i data-lucide="fingerprint" class="w-16 h-16"></i>
                            <span class="text-3xl font-bold uppercase tracking-wide">I Am Here</span>
                            <span class="text-lg opacity-90">${statusText} (${shiftInfo.startTime})</span>
                        </button>
                    </div>
                `;
            } else {
                actionButtonHtml = `
                    <div class="p-6">
                        <div class="bg-gray-100 w-full rounded-3xl p-8 border-2 border-dashed border-gray-300 flex flex-col items-center justify-center space-y-2">
                            <i data-lucide="clock" class="w-12 h-12 text-gray-400"></i>
                            <span class="text-xl font-semibold text-gray-500">No Active Shift</span>
                            <span class="text-sm text-gray-400 text-center">Next shift will appear here when it's time</span>
                        </div>
                    </div>
                `;
            }

            app.innerHTML = `
                <!-- Header -->
                <div class="bg-blue-600 text-white p-6 rounded-b-[3rem] shadow-lg">
                    <div class="flex justify-between items-start">
                        <div>
                            <h1 class="text-3xl font-bold">Welcome, Anita</h1>
                            <p class="opacity-80">${new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}</p>
                        </div>
                        <button onclick="showAdminLogin()" class="p-2 opacity-50 hover:opacity-100">
                            <i data-lucide="settings" class="w-6 h-6"></i>
                        </button>
                    </div>

                    <div class="mt-8 bg-white/20 p-6 rounded-3xl backdrop-blur-sm flex justify-between items-center">
                        <div>
                            <p class="text-sm uppercase tracking-wider opacity-80">Salary so far</p>
                            <p class="text-4xl font-bold">${state.settings.currency}${Math.round(salaryData.currentSalary).toLocaleString()}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-sm uppercase tracking-wider opacity-80">Credits</p>
                            <p class="text-2xl font-bold">${state.credits} <i data-lucide="star" class="inline w-5 h-5 fill-current"></i></p>
                        </div>
                    </div>
                </div>

                <!-- Main Action -->
                ${actionButtonHtml}

                <!-- Calendar Section (Placeholder for now) -->
                <div id="calendar-container" class="px-6 pb-6">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-bold">Your Records</h2>
                        <button onclick="setView('payout')" class="text-blue-600 font-semibold flex items-center gap-1">
                            View Payout <i data-lucide="chevron-right" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <div id="calendar-grid"></div>
                </div>
            `;

            renderCalendar();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            if (!grid) return;

            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const daysInMonth = getDaysInMonth(year, month);
            const today = now.getDate();

            let html = `<div class="grid grid-cols-7 gap-2">`;

            // Day names
            ['S','M','T','W','T','F','S'].forEach(day => {
                html += `<div class="text-center text-xs font-bold text-gray-400 py-2">${day}</div>`;
            });

            // Calculate starting day of month
            const firstDay = new Date(year, month, 1).getDay();
            for (let i = 0; i < firstDay; i++) {
                html += `<div></div>`;
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const dayAttendance = state.attendance[dateStr] || {};
                const isToday = d === today;

                html += `
                    <div class="bg-gray-50 rounded-xl p-2 flex flex-col items-center justify-between min-h-[60px] ${isToday ? 'ring-2 ring-blue-500 bg-white' : ''}">
                        <span class="text-xs font-semibold ${isToday ? 'text-blue-600' : 'text-gray-400'}">${d}</span>
                        <div class="flex gap-0.5 mt-1">
                `;

                for (let i = 0; i < state.settings.shiftTimes.length; i++) {
                    const record = dayAttendance[`shift${i}`];
                    let icon = 'circle';
                    let color = 'text-gray-200';

                    if (record) {
                        if (record.status === 'late') {
                            icon = 'clock';
                            color = 'text-yellow-500';
                        } else {
                            icon = 'check-circle';
                            color = 'text-green-500';
                        }
                    } else {
                        // Check if missed
                        const shiftStartStr = state.settings.shiftTimes[i];
                        const shiftStartMins = getTimeInMinutes(shiftStartStr);
                        const shiftTime = new Date(year, month, d);
                        shiftTime.setHours(Math.floor(shiftStartMins / 60), shiftStartMins % 60, 0, 0);
                        const windowEnd = new Date(shiftTime.getTime() + SHIFT_WINDOW_MINS * 60000);

                        if (now > windowEnd) {
                            icon = 'x-circle';
                            color = 'text-red-500';
                        }
                    }

                    html += `<i data-lucide="${icon}" class="w-3 h-3 ${color}"></i>`;
                }

                html += `
                        </div>
                    </div>
                `;
            }

            html += `</div>`;
            grid.innerHTML = html;
            lucide.createIcons();
        }

        function renderAdminView(app, salaryData) {
            app.innerHTML = `
                <div class="bg-gray-100 min-h-screen">
                    <!-- Admin Header -->
                    <div class="bg-white p-6 shadow-sm flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <button onclick="setView('maid')" class="p-2 bg-gray-100 rounded-full">
                                <i data-lucide="arrow-left" class="w-6 h-6"></i>
                            </button>
                            <h1 class="text-xl font-bold">Admin Panel</h1>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="exportCSV()" class="bg-gray-100 text-gray-700 px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-1">
                                CSV
                            </button>
                            <button onclick="exportPDF()" class="bg-blue-600 text-white px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-1">
                                PDF
                            </button>
                        </div>
                    </div>

                    <div class="p-6 space-y-6">
                        <!-- Settings Card -->
                        <div class="bg-white rounded-3xl p-6 shadow-sm space-y-4">
                            <h2 class="text-lg font-bold flex items-center gap-2">
                                <i data-lucide="settings" class="w-5 h-5 text-gray-400"></i> Settings
                            </h2>

                            <div class="space-y-4">
                                <div>
                                    <label class="text-xs font-bold text-gray-400 uppercase">Monthly Salary</label>
                                    <div class="flex gap-2 mt-1">
                                        <input type="number" id="set-salary" value="${state.settings.monthlySalary}" class="w-full border border-gray-200 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                        <button onclick="updateSetting('monthlySalary', document.getElementById('set-salary').value)" class="bg-gray-800 text-white px-6 rounded-xl font-bold active:scale-95 transition-transform">Save</button>
                                    </div>
                                </div>

                                <div>
                                    <label class="text-xs font-bold text-gray-400 uppercase">Shifts</label>
                                    <div class="grid grid-cols-3 gap-2">
                                        ${state.settings.shiftTimes.map((t, i) => `
                                            <input type="time" id="shift-${i}" value="${t}" onchange="updateShift(${i}, this.value)" class="border border-gray-200 rounded-xl p-2 text-sm">
                                        `).join('')}
                                    </div>
                                </div>

                                <div class="grid grid-cols-2 gap-4 pt-2">
                                    <div class="col-span-2 flex items-center justify-between p-4 bg-gray-50 rounded-xl">
                                        <span class="font-bold text-gray-700">Dark Mode</span>
                                        <button onclick="toggleDarkMode()" class="w-12 h-6 rounded-full bg-gray-300 relative transition-colors ${state.settings.darkMode ? 'bg-blue-600' : ''}">
                                            <div class="absolute top-1 left-1 w-4 h-4 bg-white rounded-full transition-transform ${state.settings.darkMode ? 'translate-x-6' : ''}"></div>
                                        </button>
                                    </div>
                                    <div>
                                        <label class="text-xs font-bold text-gray-400 uppercase">Admin Pass</label>
                                        <input type="password" id="set-admin-pass" value="${state.settings.adminPassword}" onchange="updateSetting('adminPassword', this.value)" class="w-full border border-gray-200 rounded-xl p-3 dark:bg-gray-700">
                                    </div>
                                    <div>
                                        <label class="text-xs font-bold text-gray-400 uppercase">Maid Pass</label>
                                        <input type="password" id="set-maid-pass" value="${state.settings.maidPassword}" onchange="updateSetting('maidPassword', this.value)" class="w-full border border-gray-200 rounded-xl p-3">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Analytics Chart -->
                        <div class="bg-white rounded-3xl p-6 shadow-sm space-y-4">
                            <h2 class="text-lg font-bold">Attendance Consistency</h2>
                            <div class="flex items-end justify-between h-32 gap-1 px-2">
                                ${renderCharts(salaryData)}
                            </div>
                            <div class="flex justify-between text-[10px] text-gray-400 font-bold uppercase px-2">
                                <span>Past 7 Days</span>
                                <span>Today</span>
                            </div>
                        </div>

                        <!-- Attendance Ledger -->
                        <div class="bg-white rounded-3xl shadow-sm overflow-hidden">
                            <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                                <h2 class="text-lg font-bold">Attendance Ledger</h2>
                                <span class="text-xs font-bold bg-blue-100 text-blue-600 px-2 py-1 rounded-full">${new Date().toLocaleString('default', { month: 'long' })}</span>
                            </div>
                            <div class="max-h-96 overflow-y-auto">
                                <table class="w-full text-left text-sm">
                                    <thead class="bg-gray-50 text-gray-400 uppercase text-[10px] font-bold">
                                        <tr>
                                            <th class="px-6 py-3">Date</th>
                                            <th class="px-6 py-3">S1</th>
                                            <th class="px-6 py-3">S2</th>
                                            <th class="px-6 py-3">S3</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-100">
                                        ${renderLedgerRows()}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderLedgerRows() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const daysInMonth = getDaysInMonth(year, month);
            let rows = '';

            for (let d = daysInMonth; d >= 1; d--) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const dayAttendance = state.attendance[dateStr] || {};

                rows += `
                    <tr>
                        <td class="px-6 py-4 font-semibold">${d} ${new Date(year, month, d).toLocaleDateString('en-US', { weekday: 'short' })}</td>
                        ${[0, 1, 2].map(i => {
                            const rec = dayAttendance[`shift${i}`];
                            let status = '';
                            if (rec) {
                                status = rec.status === 'late' ? '⚠️' : '✅';
                                return `<td class="px-6 py-4" title="${rec.time}">${status} <span class="text-[10px] text-gray-400">${rec.time}</span></td>`;
                            } else {
                                // Check if missed
                                const shiftStartStr = state.settings.shiftTimes[i];
                                const shiftStartMins = getTimeInMinutes(shiftStartStr);
                                const shiftTime = new Date(year, month, d);
                                shiftTime.setHours(Math.floor(shiftStartMins / 60), shiftStartMins % 60, 0, 0);
                                if (now > shiftTime) return `<td class="px-6 py-4">❌</td>`;
                                return `<td class="px-6 py-4 text-gray-200">○</td>`;
                            }
                        }).join('')}
                    </tr>
                `;
            }
            return rows;
        }

        function updateSetting(key, value) {
            state.settings[key] = value;
            saveState();
            if (key === 'darkMode') applyDarkMode();
            else alert("Setting updated!");
            render();
        }

        function toggleDarkMode() {
            updateSetting('darkMode', !state.settings.darkMode);
        }

        function updateShift(index, value) {
            state.settings.shiftTimes[index] = value;
            saveState();
            render();
        }

        function renderCharts(salaryData) {
            const now = new Date();
            let bars = '';
            for (let i = 6; i >= 0; i--) {
                const date = new Date();
                date.setDate(now.getDate() - i);
                const dateStr = date.toISOString().split('T')[0];
                const dayAttendance = state.attendance[dateStr] || {};
                const count = Object.keys(dayAttendance).length;
                const height = (count / 3) * 100;
                let color = 'bg-gray-200';
                if (count === 1) color = 'bg-yellow-400';
                if (count === 2) color = 'bg-blue-400';
                if (count === 3) color = 'bg-green-500';

                bars += `
                    <div class="flex-1 flex flex-col items-center gap-1">
                        <div class="${color} w-full rounded-t-lg transition-all duration-500" style="height: ${height}%"></div>
                    </div>
                `;
            }
            return bars;
        }

        function checkReminders() {
            const info = getCurrentShiftInfo();
            if (info && info.status === 'on-time' && info.diff < 15) {
                // Within 15 mins of shift start
                if (!window.lastReminder || window.lastReminder !== info.index) {
                    if ("Notification" in window && Notification.permission === "granted") {
                        new Notification("Shift Starting Soon", { body: `Anita, your ${info.startTime} shift is starting!` });
                    } else {
                        console.log("Reminder: Shift starting soon!");
                    }
                    window.lastReminder = info.index;
                }
            }
        }

        // Request notification permission
        if ("Notification" in window && Notification.permission === "default") {
            Notification.requestPermission();
        }
        setInterval(checkReminders, 60000); // Check every minute

        async function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.text(`Attendance Report – Anita`, 14, 20);
            doc.setFontSize(10);
            doc.text(`Generated on: ${new Date().toLocaleString()}`, 14, 28);

            const tableData = [];
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const daysInMonth = getDaysInMonth(year, month);

            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const dayAttendance = state.attendance[dateStr] || {};
                const row = [dateStr];

                for (let i = 0; i < 3; i++) {
                    const rec = dayAttendance[`shift${i}`];
                    if (rec) row.push(`${rec.status} (${rec.time})`);
                    else {
                        const shiftStartStr = state.settings.shiftTimes[i];
                        const shiftStartMins = getTimeInMinutes(shiftStartStr);
                        const shiftTime = new Date(year, month, d);
                        shiftTime.setHours(Math.floor(shiftStartMins / 60), shiftStartMins % 60, 0, 0);
                        if (now > shiftTime) row.push('MISSED');
                        else row.push('-');
                    }
                }
                tableData.push(row);
            }

            doc.autoTable({
                head: [['Date', 'Shift 1', 'Shift 2', 'Shift 3']],
                body: tableData,
                startY: 35
            });

            doc.save(`Attendance_Report_Anita_${new Date().toLocaleDateString()}.pdf`);
        }

        function exportCSV() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const daysInMonth = getDaysInMonth(year, month);

            let csv = "Date,Shift 1,S1 Time,Shift 2,S2 Time,Shift 3,S3 Time\n";

            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const dayAttendance = state.attendance[dateStr] || {};
                let row = `${dateStr}`;

                for (let i = 0; i < 3; i++) {
                    const rec = dayAttendance[`shift${i}`];
                    if (rec) {
                        row += `,${rec.status},${rec.time}`;
                    } else {
                        // Check if missed
                        const shiftStartStr = state.settings.shiftTimes[i];
                        const shiftStartMins = getTimeInMinutes(shiftStartStr);
                        const shiftTime = new Date(year, month, d);
                        shiftTime.setHours(Math.floor(shiftStartMins / 60), shiftStartMins % 60, 0, 0);
                        if (now > shiftTime) row += `,MISSED,-`;
                        else row += `,-,-`;
                    }
                }
                csv += row + "\n";
            }

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('hidden', '');
            a.setAttribute('href', url);
            a.setAttribute('download', `Attendance_Report_Anita_${new Date().toLocaleDateString()}.csv`);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function renderPayoutView(app, salaryData) {
            app.innerHTML = `
                <div class="bg-gray-50 min-h-screen">
                    <div class="p-6 bg-white shadow-sm flex items-center gap-4 mb-6">
                        <button onclick="setView('maid')" class="p-2 bg-gray-100 rounded-full">
                            <i data-lucide="arrow-left" class="w-6 h-6"></i>
                        </button>
                        <h1 class="text-xl font-bold uppercase tracking-tight">Review Salary</h1>
                    </div>

                    <div class="p-6 space-y-6">
                        <div class="bg-blue-600 rounded-[2rem] p-8 text-white shadow-xl text-center">
                            <p class="uppercase tracking-widest text-xs opacity-70 mb-2">Total Amount to Pay</p>
                            <p class="text-6xl font-extrabold">${state.settings.currency}${Math.round(salaryData.currentSalary).toLocaleString()}</p>
                        </div>

                        <div class="bg-white rounded-3xl p-6 shadow-sm space-y-4">
                            <h2 class="font-bold text-gray-400 uppercase text-xs">Breakdown</h2>
                            <div class="space-y-3">
                                <div class="flex justify-between text-green-600">
                                    <span>Total Earnings</span>

                                </div>

                                    <span>Late Penalties (Net)</span>
                                    <span>-${state.settings.currency}${salaryData.netLatePenalties}</span>
                                </div>
                                <div class="pt-3 border-t flex justify-between font-bold text-lg">
                                    <span>Final Salary</span>
                                    <span class="text-blue-600">${state.settings.currency}${Math.round(salaryData.currentSalary)}</span>

                            </div>

                        <div class="bg-yellow-50 border-2 border-yellow-200 rounded-3xl p-6">
                            <p class="text-sm text-yellow-800 text-center flex items-center justify-center gap-2">
                                <i data-lucide="info" class="w-4 h-4"></i>
                                Once "Transaction Done" is clicked, this month will be locked and salary will reset.
                            </p>

                        <button onclick="showFaceID(completePayout)" class="bg-green-600 w-full text-white rounded-2xl py-6 shadow-lg flex flex-col items-center justify-center space-y-2 transform active:scale-95 transition-transform">

                            <span class="text-xs opacity-80 uppercase font-bold">Requires Face ID</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function completePayout() {
            const salaryData = calculateSalary();
            const payout = {
                date: new Date().toISOString(),
                amount: salaryData.currentSalary,
                year: new Date().getFullYear(),
                month: new Date().getMonth()
            };

            state.payouts.push(payout);
            state.lastPayoutDate = new Date().toISOString();
            state.credits -= salaryData.usedCredits;

            saveState();
            alert("Salary Payout Completed Successfully!");
            setView('maid');
        }

        function submitMaidPassword() {
            const input = document.getElementById('maid-password-input').value;
            if (input === state.settings.maidPassword) {
                closePasswordModal();
                if (currentAuthCallback) currentAuthCallback('password');
            } else {
                alert("Wrong password!");
            }
        }

        function logAttendance(authMethod = 'faceid') {
            const info = getCurrentShiftInfo();
            if (!info) {
                alert("No shift available to log right now.");
                return;
            }

            const dateStr = getCurrentDateStr();
            if (!state.attendance[dateStr]) {
                state.attendance[dateStr] = {};
            }

            const record = {
                status: info.status,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                auth: authMethod,
                timestamp: new Date().getTime()
            };

            state.attendance[dateStr][`shift${info.index}`] = record;

            if (info.status === 'early') {
                state.credits += 1;
            }

            saveState();
            render(); // We'll implement render later
        }

        function getCurrentShiftInfo() {
            const nowMins = getNowInMinutes();
            const dateStr = getCurrentDateStr();
            const todayAttendance = state.attendance[dateStr] || {};

            // Find the closest shift that hasn't been logged today
            let closestShift = null;
            let minDiff = Infinity;

            for (let i = 0; i < state.settings.shiftTimes.length; i++) {
                if (todayAttendance[`shift${i}`]) continue;

                const shiftStartStr = state.settings.shiftTimes[i];
                const shiftStartMins = getTimeInMinutes(shiftStartStr);
                const diff = Math.abs(nowMins - shiftStartMins);

                if (diff < minDiff) {
                    minDiff = diff;
                    closestShift = {
                        index: i,
                        startTime: shiftStartStr,
                        shiftStartMins: shiftStartMins,
                        diff: diff
                    };
                }
            }

            if (!closestShift) return null;

            // Determine status
            let status = 'on-time';
            if (nowMins <= closestShift.shiftStartMins - SHIFT_WINDOW_MINS) {
                status = 'early';
            } else if (nowMins > closestShift.shiftStartMins + SHIFT_WINDOW_MINS) {
                status = 'late';
            }

            return {
                ...closestShift,
                status: status,
                nowMins: nowMins
            };
        }

        // Initial check for Lucide icons
        window.onload = () => {
            render();

            // Register Service Worker
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW Registered', reg))
                    .catch(err => console.log('SW Failed', err));
            }
        };
    </script>
